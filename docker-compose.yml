version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      VELORAG_DB_URL: postgresql://velorag:velorag@db:5432/velorag
      VELORAG_SECRET_KEY: ${VELORAG_SECRET_KEY:-change-me-in-production}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      VELORAG_DATA_DIR: /data/velorag
    volumes:
      - velorag_data:/data
    depends_on:
      - redis
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A velorag.tasks.celery_app worker -l info -c 4
    environment:
      VELORAG_DB_URL: postgresql://velorag:velorag@db:5432/velorag
      VELORAG_SECRET_KEY: ${VELORAG_SECRET_KEY:-change-me-in-production}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      VELORAG_DATA_DIR: /data/velorag
    volumes:
      - velorag_data:/data
    depends_on:
      - redis
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: velorag
      POSTGRES_PASSWORD: velorag
      POSTGRES_DB: velorag
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  redis_data:
  velorag_data:
  pg_data:
