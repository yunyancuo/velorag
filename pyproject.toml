[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velorag"
version = "0.2.0"
description = "Production-grade RAG framework with knowledge graph, agent canvas, and multi-tenant knowledge bases."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "httpx>=0.24",
    "tiktoken>=0.5",
    "aiofiles>=23.0",
    "python-multipart>=0.0.6",
    "PyPDF2>=3.0",
    "rank-bm25>=0.2",
    "python-docx>=1.0",
    "markdown-it-py>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pydantic[email]>=2.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.22"]
embeddings = ["sentence-transformers>=2.2"]
graph = ["networkx>=3.0"]
vector = ["chromadb>=0.4"]
queue = ["celery[redis]>=5.3"]
realtime = ["redis>=5.0"]
dev = [
    "velorag[server,embeddings,graph,vector,queue,realtime]",
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
full = ["velorag[server,embeddings,graph,vector,queue,realtime]"]

[project.scripts]
velorag = "velorag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
